name: Sync Project Versions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest releases and update
        run: |
          MNOS_TAG=$(gh api repos/ambaner/mnos16/releases/latest --jq '.tag_name')
          PARCOUR_TAG=$(gh api repos/ambaner/parcour/releases/latest --jq '.tag_name')
          echo "MNOS16: $MNOS_TAG, Parcour: $PARCOUR_TAG"
          sed -i -E "0,/<span class=\"version\">/{ /<span class=\"version\">/{s/v[0-9]+\.[0-9]+\.[0-9]+/$MNOS_TAG/} }" index.html
          tac index.html | sed -E "0,/<span class=\"version\">/{ /<span class=\"version\">/{s/v[0-9]+\.[0-9]+\.[0-9]+/$PARCOUR_TAG/} }" | tac > index.tmp && mv index.tmp index.html
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Sync project versions"
          git push
        env:
          GH_TOKEN: ${{ github.token }}
